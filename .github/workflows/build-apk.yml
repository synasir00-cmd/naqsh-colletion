name: Build NAQSH COLLECTION APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAQSH-COLLECTION-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NAQSH-COLLECTION-debug.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk NAQSH-COLLECTION-debug.apk --clobber
          else
            gh release create latest-apk NAQSH-COLLECTION-debug.apk \
              --title "NAQSH COLLECTION Debug APK" \
              --notes "Ready-to-install Android APK for NAQSH COLLECTION"
          fi
